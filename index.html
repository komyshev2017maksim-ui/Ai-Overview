<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Overview Gap Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
    --accent: #7c6aff; --accent2: #00e5c0; --text: #e8e8f0;
    --muted: #6b6b80; --warning: #ffb547; --danger: #ff6b6b;
  }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 60px 24px; position: relative; z-index: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(124,106,255,0.1); border: 1px solid rgba(124,106,255,0.3); color: var(--accent); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; margin-bottom: 20px; }
  .badge::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(32px, 5vw, 52px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; }
  h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 520px; margin-bottom: 48px; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 32px; position: relative; overflow: hidden; }
  .form-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,255,0.1); }
  input::placeholder { color: var(--muted); }
  .btn { width: 100%; padding: 14px 24px; background: linear-gradient(135deg, var(--accent), #5a4de0); border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: white; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 8px; }
  .btn:hover { opacity: 0.9; } .btn:active { transform: scale(0.99); } .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading { display: none; text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }
  .loading.visible { display: block; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .results { display: none; } .results.visible { display: block; }
  .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 24px; display: flex; align-items: center; gap: 32px; }
  .score-circle { flex-shrink: 0; width: 100px; height: 100px; position: relative; }
  .score-circle svg { transform: rotate(-90deg); width: 100px; height: 100px; }
  .score-circle .track { fill: none; stroke: var(--border); stroke-width: 6; }
  .score-circle .fill { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .score-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
  .score-info h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .score-info p { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .aio-text { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; padding: 24px; margin-bottom: 24px; font-size: 13px; line-height: 1.8; color: #c0c0d0; }
  .aio-text .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .section-title .count { background: rgba(124,106,255,0.15); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .gaps-list, .recs-list, .changes-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .gap-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
  .gap-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .gap-card.missing::before { background: var(--danger); } .gap-card.weak::before { background: var(--warning); } .gap-card.partial::before { background: var(--accent); }
  .gap-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .gap-entity { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.5; }
  .status-badge { flex-shrink: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; }
  .status-badge.missing { background: rgba(255,107,107,0.15); color: var(--danger); }
  .status-badge.weak { background: rgba(255,181,71,0.15); color: var(--warning); }
  .status-badge.partial { background: rgba(124,106,255,0.15); color: var(--accent); }
  .gap-details { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .rec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .rec-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .rec-number { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), #5a4de0); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .rec-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
  .rec-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .rec-example { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--accent2); line-height: 1.6; font-style: italic; }
  .rec-example::before { content: '// Add to page: '; color: var(--muted); font-style: normal; }
  .strengths { background: rgba(0,229,192,0.05); border: 1px solid rgba(0,229,192,0.2); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .strengths .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 12px; font-weight: 500; }
  .strength-item { font-size: 12px; color: #a0c8b8; padding: 4px 0; padding-left: 16px; position: relative; line-height: 1.6; }
  .strength-item::before { content: '✓'; position: absolute; left: 0; color: var(--accent2); }
  .no-aio { background: var(--surface); border: 1px solid rgba(255,181,71,0.3); border-radius: 16px; padding: 40px; text-align: center; }
  .no-aio-icon { font-size: 40px; margin-bottom: 16px; }
  .no-aio h3 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--warning); margin-bottom: 8px; }
  .no-aio p { color: var(--muted); font-size: 13px; }
  .error-msg { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.3); border-radius: 12px; padding: 20px; color: var(--danger); font-size: 13px; display: none; margin-bottom: 24px; }
  .error-msg.visible { display: block; }

  /* DIFF SECTION */
  .diff-section { margin-bottom: 32px; }
  .diff-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
  }
  .diff-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 12px;
  }
  .diff-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .diff-card-title {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .diff-action {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
  }
  .diff-action.replace { background: rgba(255,181,71,0.15); color: var(--warning); }
  .diff-action.insert_after { background: rgba(0,229,192,0.15); color: var(--accent2); }
  .diff-action.insert_before { background: rgba(124,106,255,0.15); color: var(--accent); }
  .diff-columns { display: grid; grid-template-columns: 1fr 1fr; }
  .diff-col { padding: 20px; }
  .diff-col.before { border-right: 1px solid var(--border); background: rgba(255,107,107,0.03); }
  .diff-col.after { background: rgba(0,229,192,0.03); }
  .diff-col-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .diff-col.before .diff-col-label { color: var(--danger); }
  .diff-col.after .diff-col-label { color: var(--accent2); }
  .diff-col-label::before { content: ''; width: 8px; height: 8px; border-radius: 50%; }
  .diff-col.before .diff-col-label::before { background: var(--danger); }
  .diff-col.after .diff-col-label::before { background: var(--accent2); }
  .diff-text {
    font-size: 12px; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
  }
  .diff-col.before .diff-text { color: #c0a0a0; }
  .diff-col.after .diff-text { color: #a0c8b8; }
  .diff-empty { color: var(--muted); font-style: italic; font-size: 12px; }
  .diff-copy-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; background: rgba(0,229,192,0.1);
    border: 1px solid rgba(0,229,192,0.2); border-radius: 6px;
    color: var(--accent2); font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  }
  .diff-copy-btn:hover { background: rgba(0,229,192,0.2); }
  .diff-copy-btn.copied { background: rgba(0,229,192,0.25); }

  @media (max-width: 640px) {
    .diff-columns { grid-template-columns: 1fr; }
    .diff-col.before { border-right: none; border-bottom: 1px solid var(--border); }
    .score-card { flex-direction: column; }
    .container { padding: 40px 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">AI-powered SEO tool</div>
    <h1>AI Overview<br><span>Gap Analyzer</span></h1>
    <p class="subtitle">Analyze your page against Google's AI Overview. See exactly what to change — before and after for every gap.</p>
  </header>

  <div class="form-card">
    <div class="form-group">
      <label>Search Query</label>
      <input type="text" id="query" placeholder="e.g. how to get rid of an old boat in Florida" />
    </div>
    <div class="form-group">
      <label>Page URL</label>
      <input type="text" id="url" placeholder="e.g. https://yoursite.com/page" />
    </div>
    <button class="btn" id="analyzeBtn" onclick="analyze()">Analyze Page →</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Analyzing your page against Google AI Overview...<br>
    <span style="font-size:11px;opacity:0.5;margin-top:8px;display:block">This may take 40–60 seconds</span>
  </div>
  <div class="results" id="results"></div>
</div>

<script>
const API_URL = 'https://primary-production-0c2e7.up.railway.app/webhook/analyze';

async function analyze() {
  const query = document.getElementById('query').value.trim();
  const url = document.getElementById('url').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const errorMsg = document.getElementById('errorMsg');

  if (!query || !url) { showError('Please fill in both fields.'); return; }

  btn.disabled = true;
  loading.classList.add('visible');
  results.classList.remove('visible');
  results.innerHTML = '';
  errorMsg.classList.remove('visible');

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, url })
    });
    if (!response.ok) throw new Error('HTTP error: ' + response.status);
    const data = await response.json();
    renderResults(data);
  } catch (err) {
    showError('Request failed: ' + err.message + '. Please try again.');
  } finally {
    btn.disabled = false;
    loading.classList.remove('visible');
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ Copy'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.textContent = '⎘ Copy'; }, 2000);
  });
}

function safe(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderResults(data) {
  const results = document.getElementById('results');

  if (data.status === 'no_ai_overview') {
    results.innerHTML = `<div class="no-aio"><div class="no-aio-icon">🔍</div><h3>No AI Overview Found</h3><p>${data.message || ''}</p><p style="margin-top:8px">Try a different query — not all searches generate an AI Overview.</p></div>`;
    results.classList.add('visible');
    return;
  }

  const gaps = data.gap_analysis?.gaps || [];
  const recs = data.recommendations || [];
  const changes = data.changes || [];
  const score = data.gap_analysis?.coverage_score || 0;
  const strengths = data.gap_analysis?.strengths || [];
  const summary = data.summary || '';
  const aioText = data.ai_overview?.text || '';

  const offset = 283 - (score / 100) * 283;
  const scoreColor = score >= 70 ? '#00e5c0' : score >= 40 ? '#ffb547' : '#ff6b6b';

  let html = `
    <div class="score-card">
      <div class="score-circle">
        <svg viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="45"/>
          <circle class="fill" id="scoreFill" cx="50" cy="50" r="45" style="stroke:${scoreColor}"/>
        </svg>
        <div class="score-number" style="color:${scoreColor}">${score}</div>
      </div>
      <div class="score-info">
        <h2>Coverage Score</h2>
        <p>${summary || 'Your page covers ' + score + '% of what Google considers important.'}</p>
      </div>
    </div>`;

  if (aioText) {
    html += `<div class="aio-text"><div class="label">Google AI Overview</div>${safe(aioText).replace(/\n/g, '<br>')}</div>`;
  }

  if (strengths.length > 0) {
    html += `<div class="strengths"><div class="label">What's already good</div>`;
    strengths.forEach(s => { html += `<div class="strength-item">${safe(s)}</div>`; });
    html += `</div>`;
  }

  if (gaps.length > 0) {
    html += `<div class="section-title">Content Gaps <span class="count">${gaps.length}</span></div><div class="gaps-list">`;
    gaps.forEach(gap => {
      html += `<div class="gap-card ${gap.status}"><div class="gap-header"><div class="gap-entity">${safe(gap.entity_or_fact)}</div><span class="status-badge ${gap.status}">${gap.status}</span></div><div class="gap-details">${safe(gap.details)}</div></div>`;
    });
    html += `</div>`;
  }

  if (recs.length > 0) {
    html += `<div class="section-title">Recommendations <span class="count">${recs.length}</span></div><div class="recs-list">`;
    recs.forEach(rec => {
      html += `<div class="rec-card"><div class="rec-header"><div class="rec-number">${rec.priority}</div><div class="rec-title">${safe(rec.title)}</div></div><div class="rec-desc">${safe(rec.description)}</div>${rec.implementation_example ? '<div class="rec-example">' + safe(rec.implementation_example) + '</div>' : ''}</div>`;
    });
    html += `</div>`;
  }

  // DIFF SECTION
  if (changes.length > 0) {
    html += `
      <div class="diff-section">
        <div class="diff-section-header">
          <div class="section-title" style="margin-bottom:0">
            What to Change <span class="count">${changes.length}</span>
          </div>
        </div>
        <div class="changes-list">`;

    changes.forEach((change, i) => {
      const actionLabel = change.action === 'replace' ? 'Replace' : change.action === 'insert_after' ? 'Insert After' : 'Insert Before';
      const hasOriginal = change.original && change.original.trim().length > 0;

      html += `
        <div class="diff-card">
          <div class="diff-card-header">
            <div class="diff-card-title">
              <span style="color:var(--muted);font-size:11px">#${i+1}</span>
              ${safe(change.section)}
            </div>
            <span class="diff-action ${change.action}">${actionLabel}</span>
          </div>
          <div class="diff-columns">
            <div class="diff-col before">
              <div class="diff-col-label">Before</div>
              ${hasOriginal 
                ? `<div class="diff-text">${safe(change.original)}</div>`
                : `<div class="diff-empty">— No existing content (new section)</div>`
              }
            </div>
            <div class="diff-col after">
              <div class="diff-col-label" style="justify-content:space-between">
                <span>After</span>
                <button class="diff-copy-btn" onclick="copyText(this.dataset.text, this)" data-text="${safe(change.improved).replace(/"/g,'&quot;')}">⎘ Copy</button>
              </div>
              <div class="diff-text">${safe(change.improved)}</div>
            </div>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }

  results.innerHTML = html;
  results.classList.add('visible');

  setTimeout(() => {
    const fill = document.getElementById('scoreFill');
    if (fill) fill.style.strokeDashoffset = offset;

    // Fix copy buttons - store raw text in dataset
    document.querySelectorAll('.diff-copy-btn').forEach(btn => {
      const rawText = changes[Array.from(document.querySelectorAll('.diff-copy-btn')).indexOf(btn)]?.improved || '';
      btn.onclick = () => copyText(rawText, btn);
    });
  }, 100);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
</script>
</body>
</html>
